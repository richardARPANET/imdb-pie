[zest.releaser]
create-wheel = yes

[tool:pytest]
addopts = -x -s -v
norecursedirs = .git
markers =
    live: hits the real IMDb API, run with -m "not live" to skip

[flake8]
exclude = .git,__pycache__,legacy,build,dist,.tox,.venv
max-complexity = 15

[tool:brunette]
line-length = 79
verbose = true
single-quotes = true
exclude = .*/node_modules/.*
